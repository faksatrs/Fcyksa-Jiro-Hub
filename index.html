<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Card</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            width: 400px;
            height: 550px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }

        .card:hover {
            transform: rotateY(10deg) rotateX(5deg);
        }

        .cover {
            height: 300px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 0 30px;
        }

        .balloon {
            position: absolute;
            font-size: 80px;
            animation: float 6s ease-in-out infinite;
        }

        .balloon:nth-child(1) { top: 20%; left: 10%; animation-delay: 0s; }
        .balloon:nth-child(2) { top: 60%; right: 15%; animation-delay: 2s; }
        .balloon:nth-child(3) { top: 30%; right: 10%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .name {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.4);
        }

        .content {
            padding: 30px;
            text-align: center;
            height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .message {
            font-size: 16px;
            line-height: 1.6;
            color: #333;
            margin-bottom: 20px;
        }

        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .qr-title {
            font-size: 14px;
            font-weight: bold;
            color: #666;
        }

        #qrcode {
            width: 100px;
            height: 100px;
            border: 3px solid #ff6b6b;
            border-radius: 12px;
            background: white;
        }

        .scan-text {
            font-size: 12px;
            color: #888;
            font-style: italic;
        }

        @media (max-width: 480px) {
            .card {
                width: 90vw;
                height: 85vh;
                margin: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="cover">
            <div class="balloon">🎈</div>
            <div class="balloon">🎉</div>
            <div class="balloon">🎊</div>
            <h1>Happy Birthday!</h1>
            <div class="name" id="nama">Teman Spesial</div>
        </div>
        
        <div class="content">
            <div class="message">
                Semoga hari spesialmu penuh dengan kebahagiaan, cinta, dan kejutan indah! 
                Kamu adalah orang yang luar biasa dan pantas mendapatkan yang terbaik! 🥳✨
            </div>
            
            <div class="qr-section">
                <div class="qr-title">Scan untuk pesan spesial!</div>
                <canvas id="qrcode"></canvas>
                <div class="scan-text">Tap/Scan QR Code</div>
            </div>
        </div>
    </div>

    <script>
        // Customisasi di sini
        const nama = "Teman Spesial"; // Ganti nama penerima
        const pesanUrl = "https://wa.me/628123456789?text=Happy%20Birthday%20Teman%20Spesial!%20🎉%20Semoga%20panjang%20umur%20dan%20bahagia%20selalu!"; // Ganti dengan WA atau link lain
        
        // Set nama
        document.getElementById('nama').textContent = nama;
        
        // Generate QR Code
        QRCode.toCanvas(document.getElementById('qrcode'), pesanUrl, {
            width: 100,
            margin: 1,
            color: {
                dark: '#000000',
                light: '#FFFFFF'
            }
        }, function (error) {
            if (error) console.error(error);
        });

        // Efek klik pada QR
        document.getElementById('qrcode').addEventListener('click', function() {
            window.open(pesanUrl, '_blank');
        });
    </script>
</body>
</html>
