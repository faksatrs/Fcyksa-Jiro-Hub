<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jianur Syifa Auni 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #000; 
            height: 100vh; 
            overflow: hidden; 
            position: relative; 
            color: white; 
        }
        .video-bg { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: 1; 
        }
        .overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.4); z-index: 2; 
        }
        .content { 
            position: relative; z-index: 10; height: 100vh; 
            display: flex; flex-direction: column; justify-content: center; 
            align-items: center; text-align: center; padding: 20px; 
        }
        .heart-explosion { position: absolute; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .heart { 
            position: absolute; font-size: 30px; color: #ff6b9d; 
            animation: heartFloat 4s infinite linear; opacity: 0; 
        }
        @keyframes heartFloat {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
        .main-title { 
            font-size: clamp(32px, 8vw, 64px); font-weight: 700; 
            background: linear-gradient(45deg, #ff6b9d, #c44569, #feca57); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            margin-bottom: 20px; animation: titleGlow 2s ease-in-out infinite alternate; 
            text-shadow: 0 0 30px rgba(255,107,157,0.5); 
        }
        @keyframes titleGlow {
            from { filter: drop-shadow(0 0 10px #ff6b9d); }
            to { filter: drop-shadow(0 0 30px #feca57); }
        }
        .name { 
            font-size: clamp(48px, 12vw, 96px); font-weight: 800; 
            color: white; margin-bottom: 30px; 
            text-shadow: 0 0 20px rgba(255,255,255,0.8), 0 0 40px rgba(255,107,157,0.6); 
            letter-spacing: -2px; 
        }
        .subtitle { 
            font-size: clamp(18px, 4vw, 28px); font-weight: 300; 
            color: rgba(255,255,255,0.9); margin-bottom: 40px; 
            opacity: 0; animation: fadeInUp 1s ease 0.5s forwards; 
        }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        .music-player { 
            background: rgba(255,255,255,0.1); backdrop-filter: blur(20px); 
            border: 2px solid rgba(255,255,255,0.2); border-radius: 50px; 
            padding: 20px 40px; display: inline-flex; align-items: center; gap: 20px; 
            margin-bottom: 40px; opacity: 0; animation: fadeInUp 1s ease 1s forwards; 
        }
        .play-btn { 
            width: 70px; height: 70px; border: none; border-radius: 50%; 
            background: linear-gradient(45deg, #ff6b9d, #feca57); color: white; 
            font-size: 24px; cursor: pointer; transition: all 0.3s; 
            box-shadow: 0 10px 30px rgba(255,107,157,0.4); 
        }
        .play-btn:hover { transform: scale(1.1); box-shadow: 0 15px 40px rgba(255,107,157,0.6); }
        .play-btn.playing { background: linear-gradient(45deg, #4ecdc4, #44bd87); }
        .photo-frame { 
            width: 120px; height: 120px; border-radius: 50%; 
            border: 4px solid rgba(255,255,255,0.3); margin: 0 auto 30px; 
            overflow: hidden; opacity: 0; animation: fadeInUp 1s ease 1.5s forwards; 
        }
        .photo-frame img { width: 100%; height: 100%; object-fit: cover; }
        .cta-buttons { display: flex; gap: 20px; opacity: 0; animation: fadeInUp 1s ease 2s forwards; }
        .btn { 
            padding: 15px 30px; border: none; border-radius: 50px; 
            font-size: 16px; font-weight: 600; cursor: pointer; 
            transition: all 0.3s; text-decoration: none; display: inline-flex; 
            align-items: center; gap: 10px; 
        }
        .btn-primary { 
            background: linear-gradient(45deg, #ff6b9d, #feca57); 
            color: white; box-shadow: 0 10px 30px rgba(255,107,157,0.4); 
        }
        .btn-secondary { 
            background: rgba(255,255,255,0.1); color: white; 
            border: 2px solid rgba(255,255,255,0.3); backdrop-filter: blur(10px); 
        }
        .btn:hover { transform: translateY(-5px); }
        @media (max-width: 480px) { 
            .cta-buttons { flex-direction: column; align-items: center; } 
            .music-player { flex-direction: column; gap: 10px; padding: 15px 25px; } 
        }
    </style>
</head>
<body>
    <!-- ✅ VIDEO ROMANTIS JIANUR -->
    <video class="video-bg" autoplay muted loop playsinline>
        <source src="https://drive.google.com/uc?export=download&id=1DG8fhLVu1TDYqOPgbTfdomo1krpcqx5Q" type="video/mp4">
    </video>
    
    <div class="overlay"></div>
    <div class="heart-explosion" id="hearts"></div>

    <div class="content">
        <div class="main-title">HAPPY</div>
        <div class="name">Jianur Syifa Auni</div>
        <div class="subtitle">First Love Forever 💕</div>
        
        <div class="music-player">
            <div style="font-size: 14px; opacity: 0.9;">♪ First Love - Utada Hikaru ♪</div>
            <button class="play-btn" id="playBtn">▶️</button>
            <audio id="music" loop preload="auto">
                <!-- ✅ LAGU JIANUR -->
                <source src="https://drive.google.com/uc?export=download&id=1KmAaiIzZHp9mL9tVPrXRAWQ_dCety06F" type="audio/mpeg">
            </audio>
        </div>

        <!-- ✅ FOTO JIANUR 1 -->
        <div class="photo-frame">
            <img src="https://drive.google.com/uc?export=download&id=1KmAaiIzZHp9mL9tVPrXRAWQ_dCety06F" alt="Jianur Syifa Auni">
        </div>

        <div class="cta-buttons">
            <!-- ✅ BUTTON HATI -->
            <button class="btn btn-primary" onclick="createHearts()">
                💖 Kirim Cinta
            </button>
            <!-- ✅ QR WA -->
            <canvas id="qrcode" class="btn btn-secondary" width="60" height="60"></canvas>
        </div>
    </div>

    <script>
        // 🔥 JIANUR SYIFA AUNI - FULL CUSTOM
        const waLink = "https://wa.me/628123456789?text=💕%20HAPPY%20BIRTHDAY%20JIANUR%20SYIFA%20AUNI!%20🎉%20First%20love%20aku%20selamanya%20❤️";
        
        // QR WA
        QRCode.toCanvas(document.getElementById('qrcode'), waLink, {
            width: 60, margin: 0, color: { dark: '#000', light: '#FFF' }
        });

        // Music Player
        const playBtn = document.getElementById('playBtn');
        const music = document.getElementById('music');
        playBtn.onclick = () => {
            if (music.paused) {
                music.play(); playBtn.innerHTML = '⏸️'; playBtn.classList.add('playing');
            } else {
                music.pause(); playBtn.innerHTML = '▶️'; playBtn.classList.remove('playing');
            }
        };

        // 💖 Heart Rain
        function createHearts() {
            const heartsContainer = document.getElementById('hearts');
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.innerHTML = ['💖','💕','💗','💓','❤️'][Math.floor(Math.random()*5)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    heartsContainer.appendChild(heart);
                    setTimeout(() => heart.remove(), 5000);
                }, i * 100);
            }
        }
        setInterval(createHearts, 10000); // Auto hearts
    </script>
</body>
</html>
