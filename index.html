<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Love Birthday 🎵💕</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }
        .star { 
            position: absolute; 
            color: #fff; 
            font-size: 20px; 
            animation: twinkle 2s infinite; 
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .card {
            width: 380px;
            max-width: 95vw;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            padding: 30px;
            text-align: center;
            transform-style: preserve-3d;
            transition: all 0.5s;
        }

        .card:hover { transform: translateY(-10px) rotateX(5deg); }

        .title {
            font-size: 32px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #ff6b6b; }
            to { text-shadow: 0 0 20px #4ecdc4; }
        }

        .name { 
            font-size: 44px; 
            font-weight: bold; 
            color: #2c3e50; 
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .music-player {
            margin: 25px 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            color: white;
        }

        .play-btn {
            width: 80px; height: 80px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff9a9e, #fecfef);
            font-size: 30px;
            cursor: pointer;
            margin: 10px auto;
            transition: all 0.3s;
            box-shadow: 0 10px 25px rgba(255,154,158,0.4);
        }

        .play-btn:hover { transform: scale(1.1); }
        .play-btn.playing { background: linear-gradient(45deg, #4ecdc4, #44bd87); }

        .photo-gallery {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            overflow-x: auto;
            padding: 10px 0;
        }

        .photo {
            width: 80px; height: 80px;
            border-radius: 15px;
            object-fit: cover;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
        }

        .photo:hover { transform: scale(1.1); border-color: #ff6b6b; }

        .game-section {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 15px;
        }

        .game-btn {
            background: linear-gradient(45deg, #ffecd2, #fcb69f);
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
        }

        .game-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        #gameResult { 
            margin-top: 10px; 
            font-weight: bold; 
            color: #27ae60;
            min-height: 20px;
        }

        .qr-section {
            margin-top: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            border-radius: 15px;
        }

        #qrcode { 
            width: 90px; height: 90px; 
            border: 4px solid #ff6b6b;
            border-radius: 15px;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .card { padding: 20px; }
            .name { font-size: 36px; }
            .title { font-size: 26px; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <div class="card">
            <div class="title">🎵 FIRST LOVE 🎵</div>
            <div class="name" id="nama">Sayangku</div>
            
            <!-- Music Player -->
            <div class="music-player">
                <div style="font-size: 18px; margin-bottom: 10px;">♪ First Love - Utada Hikaru ♪</div>
                <button class="play-btn" id="playBtn">▶️</button>
                <audio id="music" loop>
                    <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.wav" type="audio/wav">
                    <!-- Ganti dengan link lagu First Love MP3 kamu -->
                </audio>
                <div style="font-size: 12px; opacity: 0.8;">*Klik untuk mainkan lagu</div>
            </div>

            <!-- Photo Gallery -->
            <div class="photo-gallery">
                <img class="photo" src="https://images.unsplash.com/photo-1516589178581-6cd7838edbc8?w=200&h=200&fit=crop" alt="Foto 1">
                <img class="photo" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&h=200&fit=crop" alt="Foto 2">
                <img class="photo" src="https://images.unsplash.com/photo-1519345182560-3f2917c472ef?w=200&h=200&fit=crop" alt="Foto 3">
                <img class="photo" src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=200&h=200&fit=crop" alt="Foto 4">
            </div>

            <!-- Mini Game -->
            <div class="game-section">
                <h3 style="color: #2c3e50; margin-bottom: 10px;">🎮 Tebak Lirik First Love!</h3>
                <button class="game-btn" onclick="playGame()">Main Game</button>
                <div id="gameResult"></div>
            </div>

            <!-- QR Code -->
            <div class="qr-section">
                <div style="font-weight: bold; margin-bottom: 10px;">💌 Pesan Rahasia</div>
                <canvas id="qrcode"></canvas>
                <div style="font-size: 12px; margin-top: 5px;">Scan untuk kejutan spesial! ✨</div>
            </div>
        </div>
    </div>

    <script>
        // 🎵 Customisasi
        const nama = "Sayangku ❤️"; // Ganti nama
        const waLink = "https://wa.me/628123456789?text=🎵%20FIRST%20LOVE%20Birthday%20Special!%20💕%20Aku%20inget%20banget%20lagu%20ini%20kita%20dengerin%20bareng%20dulu...%20Happy%20birthday%20sayangkuuuu!%20🥰";
        
        document.getElementById('nama').textContent = nama;

        // ⭐ Bintang jatuh
        function createStars() {
            const stars = document.getElementById('stars');
            for(let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.innerHTML = '✨';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                stars.appendChild(star);
            }
        }

        // 🎵 Music Player
        const playBtn = document.getElementById('playBtn');
        const music = document.getElementById('music');
        
        playBtn.addEventListener('click', () => {
            if (music.paused) {
                music.play();
                playBtn.innerHTML = '⏸️';
                playBtn.classList.add('playing');
            } else {
                music.pause();
                playBtn.innerHTML = '▶️';
                playBtn.classList.remove('playing');
            }
        });

        // 🖼️ Photo Gallery (bisa ganti foto kamu)
        document.querySelectorAll('.photo').forEach(photo => {
            photo.addEventListener('click', function() {
                this.style.transform = 'scale(1.3)';
                setTimeout(() => this.style.transform = 'scale(1)', 200);
            });
        });

        // 🎮 Mini Game Tebak Lirik
        const lirikOptions = [
            { q: "Saigo no kisu wa...", a: "Tabako no flavor ga shita", correct: true },
            { q: "Nakushite shimatta...", a: "ima mo suki desu", correct: false },
            { q: "Anata no na wo yobu tabi...", a: "mune ga itamu", correct: true }
        ];
        
        let currentGame = 0;
        
        function playGame() {
            currentGame = Math.floor(Math.random() * lirikOptions.length);
            const opt = lirikOptions[currentGame];
            document.getElementById('gameResult').innerHTML = `
                <div style="font-size: 14px; margin-bottom: 8px;">❓ ${opt.q}</div>
                <button class="game-btn" onclick="checkAnswer(true)">${opt.a}</button>
                <button class="game-btn" onclick="checkAnswer(false)">Lainnya...</button>
            `;
        }
        
        function checkAnswer(isCorrect) {
            const opt = lirikOptions[currentGame];
            if (isCorrect === opt.correct) {
                document.getElementById('gameResult').innerHTML = '🎉 BENAR! 💕 Kamu hafal liriknya!';
            } else {
                document.getElementById('gameResult').innerHTML = '😅 Belum tepat, coba lagi!';
            }
        }

        // 📱 QR Code
        QRCode.toCanvas(document.getElementById('qrcode'), waLink, {
            width: 90,
            color: { dark: '#000', light: '#FFF' }
        });
        
        document.getElementById('qrcode').addEventListener('click', () => {
            window.open(waLink, '_blank');
        });

        // Init
        createStars();
    </script>
</body>
</html>
